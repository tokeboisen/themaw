dsl_version: '0.8'
product: The Maw
version: 10
status: draft
created: '2026-11-19'
use_case:
  name: Manage equipment
  bounded_context: Gear
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: choose which melee weapon, ranged weapon, armour, two rings and an amulet the character wears, so the
      character's build follows
      the loot the player finds and the skills the player grows.
elements:
  - id: VIEW-01
    type: view
    name: Inventory
    col: 1
    stack: 1
    actors:
      - Player
    description: >-
      The equipped melee weapon, ranged weapon, armour, two rings and an amulet, the items in the pack and the hotbar with the
      keys 1–8, each item
      with damage or armour and affixes. Part of the character sheet.
    behavior: >-
      Lists the equipped melee weapon, ranged weapon, armour, two rings and an amulet with Unequip, and the items in the pack
      with Equip – a ring with Ring 1 and Ring 2 when both ring slots are taken – and with Drop during a Tithe. Each item shows its slot, rarity, damage or armour and its affixes, and "Found this
      Tithe – lost if you fall" when that applies. It is the Equipment tab of the character sheet. Beside the items stand the character's stats –
      the five attributes with the bonus from items, life, stamina, focus, armour, melee, ranged and Echo Bolt damage,
      critical chance, load and stamina costs – in white. Pointing at or marking an item shows, under each value that would change, the
      value with the item equipped in yellow; for an item that is already equipped, the value without it.
  - id: CMD-01
    type: command
    name: Equip item
    col: 2
    stack: 1
    story: As a player I want to equip an item from my pack, so that I fight with the best gear I have.
    fields:
      - name: Item
      - name: Ring slot
  - id: CMD-02
    type: command
    name: Unequip item
    col: 2
    stack: 2
    story: As a player I want to unequip an item, so that I can sell it or carry it for later.
    fields:
      - name: Slot
  - id: CMD-03
    type: command
    name: Drop item
    col: 2
    stack: 3
    story: As a player I want to drop an item during a Tithe, so that I make room for better loot.
    fields:
      - name: Item
  - id: AGG-01
    type: aggregate
    name: Inventory
    col: 3
    stack: 2
    description: >-
      Everything a character owns and carries: the equipped melee weapon, ranged weapon, armour, two rings and an amulet, the
      items in the pack,
      potions and rations, the hotbar, and what was found in the current Tithe.
    fields:
      - name: Equipment
        attributes:
          - name: Melee weapon
          - name: Ranged weapon
          - name: Armour
          - name: Ring 1
          - name: Ring 2
      - name: Items
        attributes:
          - name: Item
        many: true
  - id: EVT-01
    type: event
    name: Item equipped
    col: 4
    stack: 1
  - id: EVT-02
    type: event
    name: Item unequipped
    col: 4
    stack: 2
  - id: EVT-03
    type: event
    name: Item dropped
    col: 4
    stack: 3
flows:
  - from: VIEW-01
    to: CMD-01
  - from: VIEW-01
    to: CMD-02
  - from: VIEW-01
    to: CMD-03
  - from: CMD-01
    to: AGG-01
  - from: CMD-02
    to: AGG-01
  - from: CMD-03
    to: AGG-01
  - from: AGG-01
    to: EVT-01
  - from: AGG-01
    to: EVT-02
  - from: AGG-01
    to: EVT-03
rules:
  - applies_to:
      - CMD-01
    text: >-
      Equipping puts the item in its slot – a melee weapon, a ranged weapon (a bow), armour, a ring or an amulet – and moves the
      item that was there into the pack. An item is only equipped when the character meets its requirements;
      otherwise "You do not meet the requirements." is shown and nothing changes. A character wears a melee weapon, a ranged weapon, armour, two rings and an amulet at
      the same time. A ring goes into a free ring slot; when both are taken, the player chooses which ring it
      replaces.
  - applies_to:
      - CMD-02
    text: >-
      Unequipping needs room in the pack. A character without a melee weapon fights unarmed in melee: 1–3 damage,
      trained as Blades.
  - applies_to:
      - CMD-03
    text: >-
      Dropping is only possible during a Tithe. The item lands on the floor at the candidate's feet, where anyone
      can pick it up again (Pick up loot); left there, it is gone when the Tithe ends. In the Rim items are sold
      instead (Market, Trade at the Forge).
  - applies_to:
      - AGG-01
    text: >-
      Weapons have damage, reach or range and attack time, and train their skill: Blades (Dagger, Rusty Sword,
      Short Sword, Fine Dagger, Longsword), Heavy Weapons (Pickaxe, War Axe, Maul, Greataxe) and Bows (Short Bow,
      Hunting Bow, Longbow). Armour gives
      armour, which reduces damage by armour / (armour + 50). Rings and amulets only have affixes.
  - applies_to:
      - AGG-01
    text: >-
      Rarity decides the affixes: Common none, Magic 1, Rare 2. Affixes are small. At item level 1: + 1–2 to an
      attribute, + 3–6 % damage (weapons only), + 3–6 life, + 1–3 armour, + 1–2 to the weapon's skill and + 3–6 %
      Echo gained (armour and rings). Each item level above 1 adds 0.15 to an attribute or the skill, 0.5 % damage,
      1 life, 0.3 armour and 0.4 % Echo gained. A higher item level also gives more damage and armour. Rings are
      never common.
  - applies_to:
      - AGG-01
    text: >-
      Weapons and armour have requirements before they can be equipped: a weapon needs a level of its skill and
      of an attribute – Blades and Bows need Dexterity, Heavy Weapons Strength – and armour needs Strength.
      Rings have none. At item level 1: Dagger, Rusty Sword, Pickaxe, Short Bow and Padded Coat need nothing;
      Short Sword Blades 8 and Dexterity 11; War Axe Heavy Weapons 10 and Strength 13; Hunting Bow Bows 10 and
      Dexterity 13; Maul Heavy Weapons 18 and Strength 16; Fine Dagger Blades 20 and Dexterity 16; Longsword
      Blades 26 and Dexterity 15; Longbow Bows 26 and Dexterity 17; Greataxe Heavy Weapons 32 and Strength 20;
      Leather Jerkin Strength 9; Mail Shirt Strength 13; Scale Coat Strength 17. Every item level above 1 adds 1
      to the skill and 1 to the attribute for every 2 levels.
  - applies_to:
      - AGG-01
    text: >-
      The skill counts with its level and the attribute with the bonuses from what the character wears.
      Requirements are checked when an item is equipped. They are shown on the item – in the inventory, the chest
      and the Forge – in red when the character does not meet them. Skill and damage are not capped by the
      weapon.
  - applies_to:
      - AGG-01
    text: >-
      Every equipped item gives its affixes – both weapons, also the one that is not chosen on the hotbar (Use the
      hotbar), and both rings.
  - applies_to:
      - AGG-01
    text: >-
      The affixes of everything a character wears add up, with no ceiling.
  - applies_to:
      - AGG-01
    text: >-
      Magic and rare items found in a Tithe are unidentified: they show the base name and "Unidentified" instead of
      their affixes, which work all the same when worn. The comparison leaves the hidden affixes out. Reveal (Reveal an
      item) or the Forge (Market, Trade at the Forge) identifies them.
  - applies_to:
      - AGG-01
    text: >-
      Rings and amulets are never common and need nothing to be worn. A ring or an amulet adds to at most one
      attribute and at most one skill. A magic amulet has + to an attribute, + to one skill (Blades, Heavy Weapons,
      Bows or Echo Arts) or + armour. A rare amulet has two affixes, and only rare amulets have the amulet powers:
      haste (attacks and Echo Arts come faster), speed (faster on the feet), + life a second and + stamina a second –
      never haste and speed on the same amulet. Haste and speed are 5 % at item level 1 and 4.5 % more for each item
      level above, at most 50 %; life is 1 a second and 0.3 more for each item level above, stamina 2 a second and
      0.5 more.
  - applies_to:
      - AGG-01
    text: >-
      Every item has a weight: Dagger and Fine Dagger 1, Short Bow 1.5, Hunting Bow 2, Rusty Sword and Longbow 2.5,
      Short Sword 3, Longsword 4, Pickaxe and Padded Coat 4, War Axe and Leather Jerkin 6, Maul 9, Greataxe 10, Mail
      Shirt 12, Scale Coat 16, a ring 0.1 and an amulet 0.2. The load is the weight of what the character wears and
      carries in the pack – not the chest. A character carries 20 + 2 for every point of Strength above 10 + 1 for
      every point of Constitution above 10 without trouble; every point of weight above that makes stamina costs 3 %
      higher (Tithe, Fight in the depths). The stats show the load and the extra stamina cost, and each item its
      weight.
scenarios:
  - title: Comparing before equipping
    applies_to:
      - VIEW-01
    gherkin: |-
      Given Kael wears a Pickaxe and has a War Axe in the pack
      When the player points at the War Axe in VIEW-01 "Inventory"
      Then the melee damage with the Pickaxe is shown in white
      And the melee damage with the War Axe is shown under it in yellow
  - title: Gear adds up
    applies_to:
      - AGG-01
    gherkin: |-
      Given Kael wears a War Axe with + 8 % damage and two rings with + 3 Strength each
      When the player performs CMD-01 "Equip item" with a Hunting Bow with + 6 % damage
      Then EVT-01 "Item equipped" is recorded
      And Kael's items give + 14 % damage and + 6 Strength
  - title: A heavy pack tires
    applies_to:
      - AGG-01
    gherkin: |-
      Given Kael has Strength 13 and Constitution 12, so he carries 28 without trouble
      When Kael carries 38 in all
      Then his stamina costs are 30 % higher
  - title: Equipping swaps the weapon
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael has a Pickaxe equipped and a Short Sword in the pack, and meets the Short Sword's requirements
      When the player performs CMD-01 "Equip item" with the Short Sword
      Then EVT-01 "Item equipped" is recorded
      And the Pickaxe is in the pack
      And Kael's blows now train Blades
  - title: Unequipping needs room
    applies_to:
      - CMD-02
    gherkin: |-
      Given Kael's pack is full
      When the player performs CMD-02 "Unequip item" with the ring
      Then nothing is recorded
      And "Your inventory is full." is shown
  - title: A bow goes into the ranged slot
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael has a Pickaxe equipped and a Short Bow in the pack
      When the player performs CMD-01 "Equip item" with the Short Bow
      Then EVT-01 "Item equipped" is recorded
      And Kael wears the Pickaxe as the melee weapon and the Short Bow as the ranged weapon
  - title: A second ring
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael wears a Bone Ring and has a Cruel Bone Ring in the pack
      When the player performs CMD-01 "Equip item" with the Cruel Bone Ring
      Then EVT-01 "Item equipped" is recorded
      And Kael wears both rings
  - title: A weapon Kael is not ready for
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael has Heavy Weapons 8 and a War Axe of item level 1 in the pack
      When the player performs CMD-01 "Equip item" with the War Axe
      Then nothing is recorded
      And "You do not meet the requirements." is shown
  - title: A dropped item lands on the floor
    applies_to:
      - CMD-03
    gherkin: |-
      Given Kael is in a Tithe with a Short Sword in the pack
      When the player performs CMD-03 "Drop item" with the Short Sword
      Then EVT-03 "Item dropped" is recorded
      And the Short Sword lies on the floor at Kael's feet
open_questions:
  - topic: Equipment slots
    question: How many weapons and rings can a character wear at the same time?
    status: resolved
    applies_to:
      - AGG-01
    resolution: >-
      Decided 2026-11-19: a melee weapon, a ranged weapon, armour and two rings at the same time.
  - topic: Weapon caps
    question: Should weapons limit how much of a skill counts?
    status: resolved
    applies_to:
      - AGG-01
    resolution: >-
      Decided 2026-11-20: yes: every weapon has a skill cap that limits both its damage bonus and how far its blows train the skill.
      Replaced the same day by requirements (see Requirements).
  - topic: Requirements
    question: Should items need a minimum skill or attribute, so new characters cannot use strong items?
    status: resolved
    applies_to:
      - AGG-01
    resolution: >-
      Decided 2026-11-20: yes, instead of the weapon's skill cap: a weapon needs its skill and one attribute
      (Blades and Bows Dexterity, Heavy Weapons Strength), armour needs Strength, rings need nothing, and the
      requirement grows with the type and the item level.
  - topic: Power from gear
    question: How much of a character's strength should come from magic items?
    status: resolved
    applies_to:
      - AGG-01
    resolution: >-
      Decided 2026-11-21: magic items must be less wild – the game is about succeeding with the character, not
      with wild gear. Magic items get 1 affix and rare 2, the affixes are small and grow slowly with the item
      level, and % damage is on weapons only. The same day a ceiling on all affixes together was tried and taken out
      again: the affixes simply add up.
  - topic: Dropped items
    question: What happens to an item that is dropped during a Tithe?
    status: resolved
    applies_to:
      - CMD-03
    resolution: >-
      Decided 2026-11-20: it lands on the floor at the candidate's feet instead of disappearing, and anyone can
      pick it up.

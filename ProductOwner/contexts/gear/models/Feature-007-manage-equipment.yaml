dsl_version: '0.8'
product: The Maw
version: 2
status: draft
created: '2026-11-19'
use_case:
  name: Manage equipment
  bounded_context: Gear
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: choose which weapon, armour and ring the character wears, so the character's build follows
      the loot the player finds and the skills the player grows.
elements:
  - id: VIEW-01
    type: view
    name: Inventory
    col: 1
    stack: 1
    actors:
      - Player
    description: >-
      The equipped weapon, armour and ring, the items in the pack and the hotbar with the keys 1–8, each item
      with damage or armour and affixes. Part of the character sheet.
    behavior: >-
      Lists the equipped weapon, armour and ring with Unequip, and the items in the pack with Equip – and with
      Drop during a Tithe. Each item shows its slot, rarity, damage or armour and its affixes, and "Found this
      Tithe – lost if you fall" when that applies.
  - id: CMD-01
    type: command
    name: Equip item
    col: 2
    stack: 1
    story: As a player I want to equip an item from my pack, so that I fight with the best gear I have.
    fields:
      - name: Item
  - id: CMD-02
    type: command
    name: Unequip item
    col: 2
    stack: 2
    story: As a player I want to unequip an item, so that I can sell it or carry it for later.
    fields:
      - name: Slot
  - id: CMD-03
    type: command
    name: Drop item
    col: 2
    stack: 3
    story: As a player I want to drop an item during a Tithe, so that I make room for better loot.
    fields:
      - name: Item
  - id: AGG-01
    type: aggregate
    name: Inventory
    col: 3
    stack: 2
    description: >-
      Everything a character owns and carries: the equipped weapon, armour and ring, the items in the pack,
      potions and rations, the hotbar, and what was found in the current Tithe.
    fields:
      - name: Equipment
        attributes:
          - name: Weapon
          - name: Armour
          - name: Ring
      - name: Items
        attributes:
          - name: Item
        many: true
  - id: EVT-01
    type: event
    name: Item equipped
    col: 4
    stack: 1
  - id: EVT-02
    type: event
    name: Item unequipped
    col: 4
    stack: 2
  - id: EVT-03
    type: event
    name: Item dropped
    col: 4
    stack: 3
flows:
  - from: VIEW-01
    to: CMD-01
  - from: VIEW-01
    to: CMD-02
  - from: VIEW-01
    to: CMD-03
  - from: CMD-01
    to: AGG-01
  - from: CMD-02
    to: AGG-01
  - from: CMD-03
    to: AGG-01
  - from: AGG-01
    to: EVT-01
  - from: AGG-01
    to: EVT-02
  - from: AGG-01
    to: EVT-03
rules:
  - applies_to:
      - CMD-01
    text: >-
      Equipping puts the item in its slot – weapon, armour or ring – and moves the item that was there into
      the pack.
  - applies_to:
      - CMD-02
    text: >-
      Unequipping needs room in the pack. A character without a weapon fights unarmed: 1–3 damage, trained
      as Blades.
  - applies_to:
      - CMD-03
    text: >-
      Dropping is only possible during a Tithe, and the item is gone. In the Rim items are sold instead (Market,
      Trade at the Forge).
  - applies_to:
      - AGG-01
    text: >-
      Weapons have damage, reach or range and attack time, and train their skill: Blades (Dagger, Rusty Sword,
      Short Sword), Heavy Weapons (Pickaxe, War Axe, Maul) and Bows (Short Bow, Hunting Bow). Armour gives
      armour, which reduces damage by armour / (armour + 50). A ring only has affixes.
  - applies_to:
      - AGG-01
    text: >-
      Rarity decides the affixes: Common none, Magic 1–2, Rare 3. Affixes are + an attribute, + % damage, +
      life, + armour, + the weapon's skill and + % Echo gained. A higher item level gives more damage, armour
      and bigger affixes. Rings are never common.
scenarios:
  - title: Equipping swaps the weapon
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael has a Pickaxe equipped and a Short Sword in the pack
      When the player performs CMD-01 "Equip item" with the Short Sword
      Then EVT-01 "Item equipped" is recorded
      And the Pickaxe is in the pack
      And Kael's blows now train Blades
  - title: Unequipping needs room
    applies_to:
      - CMD-02
    gherkin: |-
      Given Kael's pack is full
      When the player performs CMD-02 "Unequip item" with the ring
      Then nothing is recorded
      And "Your inventory is full." is shown

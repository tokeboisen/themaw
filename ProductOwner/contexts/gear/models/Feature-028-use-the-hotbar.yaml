dsl_version: '0.8'
product: The Maw
version: 9
status: draft
created: '2026-11-19'
use_case:
  name: Use the hotbar
  bounded_context: Gear
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: press a number key to draw the weapon on it for Attack (Space), or to cast the Echo Art or
      use the talent on it at once, so the character can switch between a bow at range and a blade up close, and
      cast in the middle of a fight without putting the weapon away.
elements:
  - id: VIEW-01
    type: view
    name: Depth
    col: 1
    stack: 1
    actors:
      - Player
    description: >-
      The depth of the Maw the candidate is in, with the loot on the floor and the potion and ration buttons.
    behavior: >-
      The hotbar is shown at the bottom of the screen with the keys 1–8; the key with the weapon Attack uses is
      highlighted, and a key with an Echo Art or the talent shows the cooldown left.
  - id: CMD-01
    type: command
    name: Choose hotbar key
    col: 2
    stack: 1
    story: >-
      As a player I want to press a number key, so that I draw the right weapon for Attack or cast an Echo Art at
      once.
    fields:
      - name: Key
  - id: AGG-01
    type: aggregate
    name: Inventory
    col: 3
    stack: 1
    description: >-
      Everything a character owns and carries: the equipped melee weapon, ranged weapon, armour, two rings and an amulet, the
      items in the pack,
      potions and rations, the hotbar, and what was found in the current Tithe.
    fields:
      - name: Equipment
        attributes:
          - name: Melee weapon
          - name: Ranged weapon
      - name: Hotbar
        attributes:
          - name: Key
          - name: Weapon
        many: true
      - name: Chosen key
  - id: EVT-01
    type: event
    name: Hotbar key chosen
    col: 4
    stack: 1
flows:
  - from: VIEW-01
    to: CMD-01
  - from: CMD-01
    to: AGG-01
  - from: AGG-01
    to: EVT-01
rules:
  - applies_to:
      - CMD-01
    text: >-
      A key with a weapon chooses the weapon Attack (Space) uses. A key with an equipped weapon chooses it. A key with a weapon
      in the pack draws it: it goes into its slot – melee or ranged – and the weapon that was there goes into the
      pack. Changing weapon takes 0.3 seconds, in which the candidate cannot strike. A weapon whose requirements
      the character does not meet stays in the pack, and "You do not meet the requirements." is shown over the
      candidate (Manage equipment).
  - applies_to:
      - CMD-01
    text: >-
      A key with an Echo Art casts it at once (Tithe, Cast an Echo Art), and a key with the talent uses the talent at
      once (Tithe, Use a talent); neither changes the weapon Attack uses. A key with nothing on it does nothing.
  - applies_to:
      - EVT-01
    text: >-
      Attack (Space) always strikes with the chosen weapon, and its blows train that weapon's skill (Tithe, Fight in
      the depths).
  - applies_to:
      - AGG-01
    text: >-
      A Tithe starts with the melee weapon chosen, or the ranged weapon when there is no melee weapon; with neither,
      the candidate fights unarmed. Equipping a weapon on the character sheet chooses it.
  - applies_to:
      - CMD-01
    text: Clicking a slot of the hotbar with the mouse does the same as pressing its key.
scenarios:
  - title: Drawing the bow
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael holds the Pickaxe and the Short Bow in the pack is on key 3
      When the player performs CMD-01 "Choose hotbar key" with key 3
      Then EVT-01 "Hotbar key chosen" is recorded
      And the Short Bow is the ranged weapon and the Pickaxe is still the melee weapon
      And Attack shoots the Short Bow, and its arrows train Bows
  - title: Switching back to the melee weapon
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael wears the Pickaxe and the Short Bow and has chosen the Short Bow
      When the player performs CMD-01 "Choose hotbar key" with key 1
      Then EVT-01 "Hotbar key chosen" is recorded
      And Attack strikes with the Pickaxe
  - title: Casting Echo Bolt with its key
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael holds the Pickaxe, Echo Bolt is on key 2 and a Gnawer stands 5 tiles away
      When the player performs CMD-01 "Choose hotbar key" with key 2
      Then EVT-01 "Hotbar key chosen" is recorded
      And Echo Bolt is cast at the Gnawer
      And Attack still strikes with the Pickaxe
open_questions:
  - topic: What a hotbar key does
    question: Should a key with an Echo Art cast it at once, or choose what Attack (Space) uses?
    status: resolved
    applies_to:
      - CMD-01
    resolution: >-
      Decided 2026-11-19: every key chooses what Attack (Space) uses; a weapon is drawn, an Echo Art is chosen
      without being cast. Changed 2026-11-21 by the user: a key with an Echo Art or the talent uses it at once, and a
      key with a weapon chooses the weapon Attack (Space) uses.
  - topic: Equipment slots
    question: How many weapons and rings can a character wear at the same time?
    status: resolved
    applies_to:
      - CMD-01
    resolution: >-
      Decided 2026-11-19: a melee weapon, a ranged weapon, armour and two rings at the same time.

dsl_version: '0.8'
product: The Maw
version: 8
status: draft
created: '2026-11-19'
use_case:
  name: Assign hotbar keys
  bounded_context: Gear
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: put weapons and Echo Arts on the keys 1–8, so the player can switch weapon or cast in
      the middle of a fight with one key.
elements:
  - id: VIEW-01
    type: view
    name: Inventory
    col: 1
    stack: 1
    actors:
      - Player
    description: >-
      The equipped melee weapon, ranged weapon, armour, two rings and an amulet, the items in the pack and the hotbar with the
      keys 1–8, each item
      with damage or armour and affixes. Part of the character sheet.
    behavior: >-
      At the top of the Equipment and Spells tabs of the character sheet a hotbar shows the keys 1–8 with what is on
      them, so it is always in sight without scrolling. The player marks a weapon – equipped or in the pack – or a known Echo Art in the spellbook
      (Characters, Read the spellbook) by clicking it; the marked item is highlighted and the hotbar reads "Press 1–8
      to put it on a key". Pressing a number key 1–8, or clicking a key of the hotbar, puts the marked item on that
      key. Clicking the marked item again unmarks it. × on a key empties it.
  - id: CMD-01
    type: command
    name: Assign hotbar key
    col: 2
    stack: 1
    story: >-
      As a player I want to put a weapon or an Echo Art on a number key, so that I can use it with one key
      in a fight.
    fields:
      - name: Key
      - name: Weapon
      - name: Echo Art
  - id: CMD-02
    type: command
    name: Clear hotbar key
    col: 2
    stack: 2
    story: As a player I want to clear a number key, so that my hotbar only holds what I use.
    fields:
      - name: Key
  - id: AGG-01
    type: aggregate
    name: Inventory
    col: 3
    stack: 1
    description: >-
      Everything a character owns and carries: the equipped melee weapon, ranged weapon, armour, two rings and an amulet, the
      items in the pack,
      potions and rations, the hotbar, and what was found in the current Tithe.
    fields:
      - name: Hotbar
        attributes:
          - name: Key
          - name: Weapon
          - name: Echo Art
        many: true
  - id: EVT-01
    type: event
    name: Hotbar key assigned
    col: 4
    stack: 1
  - id: EVT-02
    type: event
    name: Hotbar key cleared
    col: 4
    stack: 2
flows:
  - from: VIEW-01
    to: CMD-01
  - from: VIEW-01
    to: CMD-02
  - from: CMD-01
    to: AGG-01
  - from: CMD-02
    to: AGG-01
  - from: AGG-01
    to: EVT-01
  - from: AGG-01
    to: EVT-02
rules:
  - applies_to:
      - CMD-01
      - AGG-01
    text: >-
      The hotbar has 8 keys, 1–8. A key holds either a weapon the character owns (equipped or in the pack)
      or an Echo Art the character knows (Characters, Read the spellbook), or the character's talent (Tithe, Use a
      talent). The talent stands at the top of the spellbook with Equip and Unequip like an Echo Art.
  - applies_to:
      - CMD-01
    text: A weapon or an Echo Art is on at most one key; putting it on another key moves it.
  - applies_to:
      - VIEW-01
    text: Keys can be assigned in the Rim and during a Tithe (the character sheet is an overlay).
  - applies_to:
      - VIEW-01
      - CMD-01
    text: >-
      In the spellbook, Equip puts a known Echo Art on the first empty key and Unequip clears its key; with no empty
      key, "No free key – mark the art and press 1–8." is shown.
  - applies_to:
      - VIEW-01
      - CMD-01
    text: >-
      Only weapons and known Echo Arts can be put on a key. While something is marked, the keys 1–8 put it on a key
      instead of choosing a key (Use the hotbar); the mark stays after it is put on a key, so the same item can be
      moved on with another key. Closing the character sheet clears the mark.
  - applies_to:
      - AGG-01
    text: >-
      When a weapon on the hotbar leaves the inventory – sold, dropped, put in the chest or lost in a fall – its key is cleared.
scenarios:
  - title: A bow is put on key 3
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael has a Short Bow in the pack and key 3 is empty
      When the player performs CMD-01 "Assign hotbar key" with key 3 and the Short Bow
      Then EVT-01 "Hotbar key assigned" is recorded
  - title: Moving Echo Bolt to another key
    applies_to:
      - CMD-01
    gherkin: |-
      Given Echo Bolt is on key 2
      When the player performs CMD-01 "Assign hotbar key" with key 5 and Echo Bolt
      Then EVT-01 "Hotbar key assigned" is recorded
      And key 2 is empty
  - title: Marking an Echo Art and pressing 4
    applies_to:
      - VIEW-01
      - CMD-01
    gherkin: |-
      Given Kael knows Shatterpulse and key 4 is empty
      And the player has marked Shatterpulse in the spellbook
      When the player performs CMD-01 "Assign hotbar key" with key 4 and Shatterpulse
      Then EVT-01 "Hotbar key assigned" is recorded
      And key 4 shows Shatterpulse
  - title: Equip puts an Echo Art on the first empty key
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael's keys 1 and 2 are taken and key 3 is empty
      When the player presses Equip on Ringing Ward in the spellbook
      And the player performs CMD-01 "Assign hotbar key" with key 3 and Ringing Ward
      Then EVT-01 "Hotbar key assigned" is recorded
  - title: An unknown Echo Art cannot be put on a key
    applies_to:
      - CMD-01
    gherkin: |-
      Given Kael's Echo Arts is 12
      When the player performs CMD-01 "Assign hotbar key" with key 6 and Echo Chain
      Then nothing is recorded
open_questions:
  - topic: Assigning without scrolling
    question: The hotbar was at the bottom of the character sheet, so the player had to scroll to assign keys. How should keys be assigned?
    status: resolved
    applies_to:
      - VIEW-01
    resolution: >-
      Decided 2026-11-21: the hotbar stands at the top of the character sheet; the player marks a weapon or an Echo
      Art in the list and presses 1–8.
  - topic: Hotbar on a touch screen
    question: Phones have no number keys. How does the hotbar work on a phone?
    status: resolved
    applies_to:
      - VIEW-01
    resolution: >-
      Decided 2026-11-19: the phone waits. For now The Maw is a web app, where the hotbar is used with the
      keys 1–8 or by clicking its slots (Use the hotbar).

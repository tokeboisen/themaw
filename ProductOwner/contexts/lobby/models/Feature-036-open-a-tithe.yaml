dsl_version: '0.8'
product: The Maw
version: 2
status: draft
created: '2026-11-19'
use_case:
  name: Open a Tithe
  bounded_context: Lobby
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: open a Tithe with a name of the player's own on the server, so friends can find it and
      join.
elements:
  - id: VIEW-01
    type: view
    name: Tithes
    col: 1
    stack: 1
    actors:
      - Player
    description: The Tithes that are open on the server, and the form to open a new one.
    behavior: >-
      Opened with "Descend into the Maw" in the Rim. Lists the Tithes that are open on the server with their
      name, the user name of the player who opened them, the players in them by user name and "n of 8", each
      with Join (disabled when full). A name field and "Open a Tithe" open a new one.
  - id: CMD-01
    type: command
    name: Open a Tithe
    col: 2
    stack: 1
    story: As a player I want to open a Tithe with a name, so that my friends can find it and join me.
    fields:
      - name: Name
  - id: AGG-01
    type: aggregate
    name: Lobby
    col: 3
    stack: 1
    description: >-
      An open Tithe on the server before it is launched: its unique name, the player who opened it and the
      players who have joined.
    fields:
      - name: Name
      - name: Opened by
      - name: Players
        attributes:
          - name: User name
          - name: Character
        many: true
  - id: EVT-01
    type: event
    name: Tithe opened
    col: 4
    stack: 1
  - id: VIEW-02
    type: view
    name: Lobby
    col: 5
    stack: 1
    actors:
      - Player
    description: 'The waiting room of an open Tithe: its name and the players in it.'
    behavior: >-
      Shows the Tithe's name and its players with user name, character and Mark, "n of 8", and Leave. The player
      who opened the Tithe also has Launch.
flows:
  - from: VIEW-01
    to: CMD-01
  - from: CMD-01
    to: AGG-01
  - from: AGG-01
    to: EVT-01
  - from: EVT-01
    to: VIEW-02
rules:
  - applies_to:
      - CMD-01
    text: >-
      The name is 3–30 characters and must be unique among the Tithes that are open or running on the server
      ("A Tithe with this name already exists.").
  - applies_to:
      - EVT-01
    text: >-
      The player who opens a Tithe is in it with the chosen character, and the Tithe shows in the list for
      everyone.
scenarios:
  - title: Kael opens Ashfall
    applies_to:
      - CMD-01
    gherkin: |-
      Given no Tithe is called "Ashfall"
      When the player performs CMD-01 "Open a Tithe" with "Ashfall"
      Then EVT-01 "Tithe opened" is recorded
      And VIEW-02 "Lobby" shows Ashfall with Kael's user name and Launch
  - title: The name is taken
    applies_to:
      - CMD-01
    gherkin: |-
      Given a Tithe called "Ashfall" is open
      When the player performs CMD-01 "Open a Tithe" with "Ashfall"
      Then nothing is recorded
      And "A Tithe with this name already exists." is shown
open_questions:
  - topic: Tithe names
    question: How long can the name of a Tithe be?
    status: resolved
    applies_to:
      - CMD-01
    resolution: 'Decided 2026-11-19: 3–30 characters.'

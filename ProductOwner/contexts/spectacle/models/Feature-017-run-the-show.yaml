dsl_version: '0.8'
product: The Maw
version: 3
status: draft
created: '2026-11-19'
use_case:
  name: Run the show
  bounded_context: Spectacle
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: the Mirrormaster and the crowd react to everything the candidates do – Renown, sponsor
      gifts, beasts and sealed depths – so the Tithe is a show that pushes the candidates deeper.

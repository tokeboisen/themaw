rules:
  - applies_to:
      - CMD-01
    text: >-
      Renown: 2 × level for each monster the player slays, 60 for each NPC rival or player the player defeats,
      150 for The Foreman, 20 for each new depth and 15 for each sponsor gift.
  - applies_to:
      - CMD-02
    text: >-
      Three kills by the player within 8 seconds, at most every 30 seconds, make a Noble House – House Morrow,
      House Vane, House Ashgrave or House Lisle – drop a gift by the player: a magic item (30 %), a potion
      (25 %), a ration (20 %) or gold (25 %). Kills of monsters called by the Mirrormaster or The Foreman do
      not count.
  - applies_to:
      - CMD-03
    text: >-
      After 40 seconds without the player dealing damage, the crowd is bored and the Mirrormaster releases
      4 Gnawers 6–11 tiles from the player. They drop nothing.
  - applies_to:
      - CMD-04
      - EVT-10
    text: >-
      Depth 1 is sealed 240 seconds after the Tithe starts and depth 2 after 480 seconds; the last depth is
      never sealed. A candidate who enters a depth with less than 90 seconds left gets 90 seconds. In The Broken
      City the districts are sealed from the outside in: the outer ring after 240 seconds, the second after 420 and
      the third after 600; the foundry is never sealed. The Mirrormaster announces the seal 30 seconds before, and
      the HUD shows the time left.
  - applies_to:
      - SVC-01
    text: >-
      The Mirrormaster speaks to the whole Tithe in the message log: at the start, about the grace, before
      and at a seal, when he is bored, about sponsor gifts, when rivals reach a depth or fall, when The Foreman
      wakes and dies, and when the Tithe has a Champion.
scenarios:
  - title: A kill streak brings a sponsor gift
    applies_to:
      - SVC-01
    gherkin: |-
      Given Kael has slain two Gnawers within the last 5 seconds and no gift has fallen for 30 seconds
      When EVT-04 "Monster slain" has been recorded for Kael's third Gnawer
      Then SVC-01 "Mirrormaster" performs CMD-02 "Drop sponsor gift"
      And EVT-08 "Sponsor gift dropped" is recorded next to Kael
      And EVT-07 "Renown earned" is recorded with 15 Renown
  - title: A bored crowd gets beasts
    applies_to:
      - SVC-01
    gherkin: |-
      Given the last EVT-03 "Blow landed" by Kael was 40 seconds ago
      When SVC-01 "Mirrormaster" reacts
      Then CMD-03 "Release beasts" is performed with 4 Gnawers
      And EVT-09 "Beasts released" is recorded
  - title: Depth 1 is sealed
    applies_to:
      - SVC-01
    gherkin: |-
      Given EVT-01 "Tithe started" was recorded 210 seconds ago
      When SVC-01 "Mirrormaster" reacts
      Then EVT-10 "Depth sealing announced" is recorded for depth 1 in 30 seconds
      And EVT-11 "Depth sealed" is recorded for depth 1 after 240 seconds

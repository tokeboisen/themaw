    stimulus:
      bounded_context: Tithe
      use_case: Enter the Tithe
      event: EVT-02
  - id: EVT-02
    type: event
    name: Depth reached
    col: 1
    stack: 2
    stimulus:
      bounded_context: Tithe
      use_case: Descend
      event: EVT-01
  - id: EVT-03
    type: event
    name: Beasts released
    col: 1
    stack: 3
    stimulus:
      bounded_context: Spectacle
      use_case: Run the show
      event: EVT-09
  - id: EVT-04
    type: event
    name: Depth sealed
    col: 1

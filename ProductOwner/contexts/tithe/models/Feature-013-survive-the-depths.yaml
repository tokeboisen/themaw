dsl_version: '0.8'
product: The Maw
version: 5
status: draft
created: '2026-11-19'
use_case:
  name: Survive the depths
  bounded_context: Tithe
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: the Maw fights back – monsters hunt the candidates, a sealed depth collapses, hunger
      grows – and potions and rations help, so every Tithe is a fight to stay alive.

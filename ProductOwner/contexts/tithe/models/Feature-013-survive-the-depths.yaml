      - name: Damage
  - id: CMD-02
    type: command
    name: Heal candidate
    col: 3
    stack: 4
    fields:
      - name: Candidate
      - name: Life
  - id: CMD-03
    type: command
    name: Feed candidate
    col: 3
    stack: 5
    fields:

        attributes:
          - name: Name
          - name: Life
          - name: Hunger
          - name: Status
        many: true
  - id: EVT-07
    type: event
    name: Candidate wounded
    col: 5
    stack: 1
  - id: EVT-08
    type: event
    name: Candidate healed
    col: 5
    stack: 2
  - id: EVT-09
    type: event
    name: Candidate fed
    col: 5
    stack: 3
  - id: EVT-10
    type: event
    name: Player fell

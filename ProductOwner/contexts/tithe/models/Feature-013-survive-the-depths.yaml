rules:
  - applies_to:
      - SVC-01
    text: >-
      Monsters are many – 2–5 in every room of the mines, groups in the corridors, and bands in the streets and
      houses of The Broken City. They sleep until a candidate comes into sight, then hunt the nearest candidate,
      also around walls.
      Before each attack they wind up, so a dodge avoids it: a dash of 3 tiles in 0.18 seconds that cannot
      be hit, for 20 stamina.
  - applies_to:
      - CMD-01
    text: Damage to a candidate is reduced by armour / (armour + 50).
  - applies_to:
      - CMD-01
      - SVC-01
    text: >-
      Some monsters harm more than life: the Cave Spider's web and the Harpy's shriek make a player 40 % slower for
      2 and 1.5 seconds, the Ghoul's claws stun for 0.6 seconds, the Rust Ooze eats 3 armour for 10 seconds, the
      Wraith drains 20 stamina and 8 focus, and the Kobold Sapper's fire pots burst over 1.3 tiles. The HUD shows
      when the player is slowed, stunned or corroded.
  - applies_to:
      - SVC-01
    text: >-
      Some monsters fight in a way of their own: the Tunnel Goblin flees below 25 % life; the Skeleton Miner takes
      half damage from arrows; the Cave Troll heals 2 % of its life per second unless an Echo Bolt hit it within 5
      seconds; Feral Hounds hit 20 % harder for every other hound within 3 tiles, at most 60 %; the Cutthroat
      sidesteps a blow 30 % of the time, at most every 3 seconds; a Hollow rises once with 40 % of its life; the
      Cultist of the Maw heals the monsters within 5 tiles by 15 % every 6 seconds; a Gargoyle stands still until a
      candidate is within 3 tiles; Harpies fly over rubble; and the Scrap Golem takes double damage from Echo
      Bolt.
  - applies_to:
      - SVC-02
      - CMD-03
    text: >-
      Hunger falls by 0.25 per second, 2 % slower per Stamina above 10. At 0 the candidate starves: stamina
      recovers at 40 % and life does not recover. Otherwise life recovers 0.3 per second.
  - applies_to:
      - SVC-02
    text: >-
      A sealed depth – or a sealed district of The Broken City, with the floors of its houses – wounds every
      candidate in it by 3 % of max life per second until they leave it.
  - applies_to:
      - CMD-02
      - CMD-03
    text: A potion heals 40 % of max life, and a ration restores 45 hunger (Gear, Use consumables).
  - applies_to:
      - EVT-10
      - EVT-11
    text: >-
      When a player's life reaches 0, the player falls and the Brand drags them back: the player's part of
      the Tithe ends (End the Tithe), and the other candidates go on. An NPC rival whose life reaches 0 falls
      and leaves the Tithe.
scenarios:
  - title: A potion heals
    applies_to:
      - SVC-02
    gherkin: |-
      Given Kael has 20 of 60 life
      When EVT-05 "Potion drunk" has been recorded
      Then SVC-02 "Condition keeper" performs CMD-02 "Heal candidate" with 24 life
      And EVT-08 "Candidate healed" is recorded
      And Kael has 44 of 60 life
  - title: The player falls
    applies_to:
      - SVC-01
    gherkin: |-
      Given Kael has 3 life
      When SVC-01 "Monsters" performs CMD-01 "Wound candidate" with 5 damage on Kael
      Then EVT-07 "Candidate wounded" is recorded
      And EVT-10 "Player fell" is recorded
  - title: A sealed depth collapses
    applies_to:
      - SVC-02
    gherkin: |-
      Given Kael has 60 max life and is still in depth 1
      When EVT-04 "Depth sealed" has been recorded for depth 1
      Then SVC-02 "Condition keeper" performs CMD-01 "Wound candidate" with 1.8 damage per second until Kael leaves depth 1
open_questions:
  - topic: Monster traits
    question: Should the monsters have traits of their own beyond how they fight?
    status: resolved
    applies_to:
      - SVC-01
    resolution: >-
      Decided 2026-11-20: yes – slowing, stunning, corroding, draining, area attacks, fleeing, healing,
      regeneration, resistances and weaknesses, as the rules list them.

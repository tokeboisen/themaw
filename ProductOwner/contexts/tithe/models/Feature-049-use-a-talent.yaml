dsl_version: '0.8'
product: The Maw
version: 3
status: draft
created: '2026-11-21'
use_case:
  name: Use a talent
  bounded_context: Tithe
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: use the talent of the character's background – Hide, Berserk, Haste or Healing Circle – at
      the right moment in a fight, so each background plays differently and the player grows the talent by using
      it.
elements:
  - id: VIEW-01
    type: view
    name: Depth
    col: 1
    stack: 1
    actors:
      - Player
    description: >-
      The depth of the Maw the candidate is in: the map around the candidate, candidates and monsters in sight, loot on
      the floor, life, stamina, focus, hunger, Renown, the seal timer and the rivals' depths.
    behavior: >-
      The talent's key on the hotbar shows the cooldown left. While Hide lasts the candidate is drawn see-through, and
      others see it as transparent as the talent makes it; while Berserk lasts the swing is drawn as wide as it
      reaches; a Healing Circle glows around the candidate and follows it while it heals. The HUD shows Hidden, Berserk and Hasted while
      they last.
  - id: CMD-01
    type: command
    name: Use talent
    col: 2
    stack: 1
    story: >-
      As a player I want to use my character's talent with one key, so that I can hide, rage, run or heal when the
      fight calls for it.
    fields:
      - name: Talent
  - id: AGG-01
    type: aggregate
    name: Tithe
    col: 3
    stack: 1
    description: >-
      One run into the Maw: its seed and depths, its candidates (the player and the rivals), the monsters, the Warden
      and the outcome.
    fields:
      - name: Candidates
        attributes:
          - name: Stamina
          - name: Focus
          - name: Talent cooldown
          - name: Effects
        many: true
      - name: Healing circles
        attributes:
          - name: Place
          - name: Radius
          - name: Time left
        many: true
  - id: EVT-01
    type: event
    name: Talent used
    col: 4
    stack: 1
flows:
  - from: VIEW-01
    to: CMD-01
  - from: CMD-01
    to: AGG-01
  - from: AGG-01
    to: EVT-01
rules:
  - applies_to:
      - CMD-01
    text: >-
      Every background has one talent (Characters, Create character): Street Runner Hide, Miner Berserk, Poacher
      Haste and Temple Acolyte Healing Circle. Pressing the talent's key uses it at once (Gear, Use the hotbar); the
      weapon chosen for Attack stays chosen. It costs stamina or focus and then waits for its cooldown;
      without enough, or before the cooldown is over, nothing happens. The numbers grow with the effective talent
      skill (level + attribute bonus), written s below.
  - applies_to:
      - AGG-01
    text: >-
      Hide (Street Runner; 12 focus, 12 s): works anywhere, also in plain sight. For 5 + 0.2 × s seconds (at most 15)
      the candidate is 50 + s % transparent (at most 90 %). Others – monsters, rivals and players outside the party –
      only see and strike it within (100 − transparency) / 10 tiles: 5 tiles at 50 %, 1 tile at 90 %; beyond that it
      is invisible. Striking or casting ends Hide. Attributes: Dexterity 60 %, Intelligence 40 %.
  - applies_to:
      - AGG-01
    text: >-
      Berserk (Miner; 25 stamina, 20 s): for 6 + 0.1 × s seconds (at most 12) melee blows reach 20 + s % farther (at
      most 60 %) and swing 60 + 6 × s degrees wider than the weapon, up to 360 degrees all around the candidate.
      Attributes: Strength 60 %, Constitution 40 %.
  - applies_to:
      - AGG-01
    text: >-
      Haste (Poacher; 20 stamina, 18 s): for 6 + 0.1 × s seconds (at most 12) the candidate moves, shoots and its
      arrows fly 15 + 0.5 × s % faster (at most 50 %). Attributes: Dexterity 60 %, Stamina 40 %.
  - applies_to:
      - AGG-01
    text: >-
      Healing Circle (Temple Acolyte; 18 focus, 15 s): a circle with a radius of 3 + 0.04 × s tiles (at most 5)
      glows around the candidate for 5 seconds and moves with it, and heals the candidate and its party members
      standing in it – in the arena its side – by 15 + 0.5 × s % of their max life (at most 40 %) over the 5
      seconds. Attributes: Intelligence 70 %, Constitution 30 %.
  - applies_to:
      - EVT-01
    text: >-
      Using the talent trains it (Characters, Learn by use), except in the arena, where nothing is trained.
scenarios:
  - title: Hiding in plain sight
    applies_to:
      - CMD-01
    gherkin: |-
      Given Rook is a Street Runner with an effective Hide of 30 and 20 focus, and a Gnawer is 4 tiles away
      When the player performs CMD-01 "Use talent" with Hide
      Then EVT-01 "Talent used" is recorded
      And Rook is 80 % transparent for 11 seconds and has 8 focus left
      And the Gnawer does not see Rook until it is within 2 tiles
  - title: Berserk all around
    applies_to:
      - AGG-01
    gherkin: |-
      Given Kael is a Miner with a Pickaxe and an effective Berserk of 40, and Gnawers stand on all sides of him
      When the player performs CMD-01 "Use talent" with Berserk
      Then EVT-01 "Talent used" is recorded
      And Kael's next swing hits the Gnawers on all sides
  - title: Not enough stamina
    applies_to:
      - CMD-01
    gherkin: |-
      Given Vessa is a Poacher with 10 stamina
      When the player performs CMD-01 "Use talent" with Haste
      Then nothing is recorded
  - title: The Healing Circle heals the party
    applies_to:
      - AGG-01
    gherkin: |-
      Given Mira is a Temple Acolyte and Jory, in her party, stands 2 tiles from her with 20 of 60 life
      When the player performs CMD-01 "Use talent" with Healing Circle
      Then EVT-01 "Talent used" is recorded
      And Jory heals over 5 seconds while he stands in the circle
open_questions:
  - topic: Talents
    question: What should each background be able to do that the others cannot?
    status: resolved
    applies_to:
      - CMD-01
    resolution: >-
      Decided 2026-11-21: one trainable talent per background on a hotbar key – Hide (Street Runner, focus), Berserk
      (Miner, stamina), Haste (Poacher, stamina) and Healing Circle (Temple Acolyte, focus). The key uses the talent
      at once, and only the background's own talent can be trained (my recommendations; the user did not choose).

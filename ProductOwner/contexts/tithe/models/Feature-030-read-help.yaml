dsl_version: '0.8'
product: The Maw
version: 13
status: draft
created: '2026-11-19'
use_case:
  name: Read help
  bounded_context: Tithe
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: look up the shortcut keys and short texts about how the game works, so a new player can
      learn the game while playing.
elements:
  - id: VIEW-01
    type: view
    name: Help
    col: 1
    stack: 1
    actors:
      - Player
    description: Shortcut keys and short help texts about the game.
    behavior: >-
      Opened with the Help button or H, in the Rim and during a Tithe, as a see-through overlay like the character
      sheet; the Tithe goes on behind it. Tabs down the left side show one subject at a time: first Keys, after that
      the tab last read. Keys lists the shortcut keys – move (WASD or arrows), attack with the chosen weapon
      (Space), use the hotbar (1–8, or click a slot: a weapon is drawn, an Echo Art or the talent used at once), dodge (Shift), potion (Q), focus potion (E),
      ration (R), descend, climb the stairs, the gate and the places on the square (F), character (C), other
      players (O), help (H) and close or go back (Esc) – and what is on the hotbar. Then come short texts on: The
      Tithe, The Reaches, Fighting, Hiding, Skills and Marks, Talents, Echo Arts, The character
      sheet, Gear and loot, Hunger
      and supplies, The Mirrormaster, The Rim, Playing with others and The Arena. The last tab, Bestiary, lists the
      monsters of each Reach with their levels, how they fight, their traits and what they are weak against.
flows: []
rules:
  - applies_to:
      - VIEW-01
    text: The help texts are short (a few sentences per topic) and in English, like the rest of the game.
  - applies_to:
      - VIEW-01
    text: The key list shows what is actually on the hotbar keys of the character being played.
  - applies_to:
      - VIEW-01
    text: >-
      Esc always closes what is open on top, also while typing in a field: the character sheet, Help, Other
      players, the places on the square, the Tithe Board, the lobby (the player stays in it), Account and every
      confirmation, which then counts as Stay or Keep. On Player statistics Esc goes back like the Back button.
scenarios:
  - title: Help during a Tithe
    applies_to:
      - VIEW-01
    gherkin: |-
      Given Kael is in a Tithe
      When the player opens VIEW-01 "Help"
      Then the Keys tab is shown with the tabs of the other subjects down the left side
      And the Tithe goes on behind the help
  - title: Reading about hiding
    applies_to:
      - VIEW-01
    gherkin: |-
      Given Kael has Help open on Keys
      When the player opens VIEW-01 "Help" on the tab Hiding
      Then the text on hiding in bushes is shown
  - title: Esc closes what is open
    applies_to:
      - VIEW-01
    gherkin: |-
      Given Kael stands on the square with the Forge open
      When the player presses Esc
      Then the Forge closes
      And Kael stands on the square
open_questions:
  - topic: Esc
    question: What should Esc do?
    status: resolved
    applies_to:
      - VIEW-01
    resolution: >-
      Decided 2026-11-20: Esc always closes dialogs and overlays.

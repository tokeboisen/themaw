dsl_version: '0.8'
product: The Maw
version: 15
status: draft
created: '2026-11-19'
use_case:
  name: Fight in the depths
  bounded_context: Tithe
  lifecycle: planned
  purpose:
    derived: false
    text: >-
      For the player: strike monsters, rivals and other players with the chosen weapon or an Echo Art, so
      the candidate survives, earns Echo and Renown and finds loot.
elements:
  - id: VIEW-01
    type: view
    name: Depth
    col: 1
    stack: 1
    actors:
      - Player
    description: >-
      The depth of the Maw the candidate is in: the map around the candidate, candidates and monsters in sight,
      loot on the floor, life, stamina, focus, hunger, Renown, the seal timer and the rivals' depths.
    behavior: >-
      A melee swing shows a pale arc; damage numbers rise over the one hit (critical hits in gold, damage to
      the player in red). Monsters about to strike in melee show their reach in red, and the Foreman's slam a red
      circle; monsters that shoot show no aim line – they just shoot.
      Under every monster a small text shows its name and level, e.g. "Goblin · L4", grey when it is easy for the
      player's Mark, white when even, orange when hard and red when deadly; Veterans are named in gold.
  - id: CMD-01
    type: command
    name: Strike
    col: 2
    stack: 1
    story: As a player I want to strike with my weapon, so that I kill what stands between me and the bottom.
    fields:
      - name: Weapon
      - name: Target
  - id: CMD-02
    type: command
    name: Cast Echo Bolt
    col: 2
    stack: 2
    story: As a player I want to cast an Echo Bolt, so that I can hit from afar with any weapon.
    fields:
      - name: Target
  - id: AGG-01
    type: aggregate
    name: Tithe
    col: 3
    stack: 3
    description: >-
      One run into the Maw: its seed and depths, its candidates (the player and the rivals), the monsters,
      the Warden and the outcome.
    fields:
      - name: Candidates
        attributes:
          - name: Name
          - name: Life
          - name: Stamina
          - name: Focus
          - name: Hostile
        many: true
      - name: Monsters
        attributes:
          - name: Kind
          - name: Level
          - name: Life
        many: true
      - name: Warden alive
      - name: Gate open
      - name: Record
        attributes:
          - name: Kills
          - name: Rivals defeated
  - id: EVT-01
    type: event
    name: Blow landed
    col: 4
    stack: 1
  - id: EVT-02
    type: event
    name: Monster slain
    col: 4
    stack: 2
  - id: EVT-03
    type: event
    name: Rival defeated
    col: 4
    stack: 3
  - id: EVT-04
    type: event
    name: Warden slain
    col: 4
    stack: 4
  - id: EVT-05
    type: event
    name: Loot dropped
    col: 4
    stack: 5
  - id: EVT-06
    type: event
    name: Player defeated
    col: 4
    stack: 6
flows:
  - from: VIEW-01
    to: CMD-01
  - from: VIEW-01
    to: CMD-02
  - from: CMD-01
    to: AGG-01
  - from: CMD-02
    to: AGG-01
  - from: AGG-01
    to: EVT-01
  - from: AGG-01
    to: EVT-02
  - from: AGG-01
    to: EVT-03
  - from: AGG-01
    to: EVT-04
  - from: AGG-01
    to: EVT-05
  - from: AGG-01
    to: EVT-06
rules:
  - applies_to:
      - CMD-01
    text: >-
      Aim is automatic: the nearest monster or hostile NPC rival within reach and in sight; another player
      or a peaceful NPC rival only when nothing else is near. Party members are never aimed at. A melee weapon
      hits everything in its arc (blades 80–100°, heavy weapons 140–150°); a bow shoots an arrow.
  - applies_to:
      - CMD-01
    text: >-
      A strike costs stamina and cannot be repeated before the weapon's attack time has passed. A heavy load makes
      strikes, dodges and talents cost more stamina (Gear, Manage equipment), and an amulet's haste shortens the
      attack time and Echo Art cooldowns. Damage is the
      weapon's damage × (1 + 1.5 % per effective skill level) × (1 + % damage from items). Critical hits –
      5 % + 0.5 % per Dexterity above 10 – deal 1.6 times the damage.
  - applies_to:
      - CMD-02
    text: >-
      Every character can cast Echo Bolt: pressing its hotbar key casts it at the automatic target (Gear, Use
      the hotbar). It costs 8 focus, flies 8 tiles and trains Echo Arts; its damage grows with the effective Echo Arts.
  - applies_to:
      - CMD-01
      - EVT-06
    text: >-
      Players may strike players outside their party, never members of their own party; a player without a
      party can be struck by every other player once the grace is over. A player who is struck down by another
      player is defeated: the player falls and leaves the Tithe (End the Tithe).
  - applies_to:
      - EVT-06
    text: >-
      A defeated player spills 10–20 % of the gold in the wallet on the floor where the player fell, for anyone
      to pick up (Market, Keep the wallet), and the one who struck the player down gets a Player kill (Characters,
      Keep player statistics).
  - applies_to:
      - EVT-03
    text: >-
      A rival that is struck becomes hostile to the player. A defeated rival is dragged back by the Brand and
      drops gold and perhaps an item.
  - applies_to:
      - EVT-02
      - EVT-04
    text: >-
      EVT-02 "Monster slain" is recorded for every monster, The Foreman included. Only the player who slays
      The Foreman opens the gate (Claim the Tithe); if a rival slays him, the rival claims the Tithe (Rivals
      race).
  - applies_to:
      - EVT-05
    text: >-
      A monster slain by the player drops gold (20 %), an item (5 %; the Tunnel Brute, Cave Troll, Scrap Golem,
      Mossback Bear and Briar Treant 15 %) and a supply (4 %): a potion, a focus potion or a ration, a third
      each. A Veteran drops gold (60 %), an item
      (50 %, magic one time in twelve and rare one in a hundred) and a supply (15 %). Otherwise an item is magic 2 %
      and rare 0.3 % of the time, a little more in the deeper depths and districts, so a magic weapon is a real
      find. The Warden drops gold and one magic item – a rare one in one of ten. Magic and rare items that drop are
      unidentified (Gear, Reveal an item). Monsters called by the Mirrormaster or The
      Foreman drop nothing. A cache drops gold, one item and perhaps a supply when the candidate walks into it.
  - applies_to:
      - AGG-01
    text: >-
      The monsters of The Old Mines: the Gnawer, the Tunnel Goblin, the Kobold Sapper, the Crystal Spitter, the
      Cave Spider, the Skeleton Miner, the Ghoul, the Rust Ooze, the Tunnel Brute and the Cave Troll, and The
      Foreman (the Warden: a slam around him, calls Gnawers every 14 seconds, never leaves his hall). The
      monsters of The Broken City: the Sewer Rat, the Feral Hound, the Cutthroat, the Bandit Archer, the Hollow,
      the Cultist of the Maw, the Gargoyle, the Harpy, the Scrap Golem and the Wraith, and The Smelter in the
      foundry, who fights like The Foreman. The monsters of The Woods: the Grey Wolf, the Brigand, the Brigand
      Archer, the Wild Boar, the Thornling, the Bog Wisp, the Mossback Bear, the Barrow Wight, the Briar Treant and
      the Fen Witch, and The Antlered King in the heart, who fights like The Foreman and calls Grey Wolves. Each fights in its own way – a swarm, a skirmisher, a ranged fighter,
      a tank or a caster – and some only live in the deeper depths or the inner districts.
  - applies_to:
      - AGG-01
    text: >-
      A monster's level is the area's level – the Tithe's level + 1 for every depth or district after the first –
      minus 1 to plus 2; about 8 % are Veterans, 3 levels above the area, with better loot. Life grows by 40 % and
      damage by 30 % per level. For every level above 1 a monster also gets 1 more armour for every 2 levels, strikes
      2 % faster (at most 30 %) and moves 1 % faster (at most 20 %), so a high-level monster is tougher, quicker and
      harder to hurt.
scenarios:
  - title: A blow slays a Gnawer
    applies_to:
      - CMD-01
    gherkin: |-
      Given a level 1 Gnawer with 5 life left is next to Kael
      When the player performs CMD-01 "Strike" with the Pickaxe
      Then EVT-01 "Blow landed" is recorded
      And EVT-02 "Monster slain" is recorded
  - title: Striking a peaceful rival makes her hostile
    applies_to:
      - CMD-01
    gherkin: |-
      Given Vessa Thorne is peaceful and the only candidate near Kael
      When the player performs CMD-01 "Strike"
      Then EVT-01 "Blow landed" is recorded on Vessa Thorne
      And Vessa Thorne is hostile to Kael
  - title: No focus, no bolt
    applies_to:
      - CMD-02
    gherkin: |-
      Given Kael has 5 focus
      When the player performs CMD-02 "Cast Echo Bolt"
      Then nothing is recorded
  - title: A party member is never hit
    applies_to:
      - CMD-01
    gherkin: |-
      Given Brann is in Kael's party and stands in Kael's swing
      When the player performs CMD-01 "Strike"
      Then no blow lands on Brann
open_questions:
  - topic: Players fighting players
    question: May players strike players outside their party?
    status: resolved
    applies_to:
      - CMD-01
      - EVT-06
    resolution: >-
      Decided 2026-11-19: yes, players in other parties and players without a party; never members of their
      own party.
  - topic: What a defeated player drops
    question: >-
      Proposal: a player defeated by another player spills 10–20 % of the gold in the wallet on the floor,
      and the one who struck the player down gets a Player kill, shown in the player statistics. Is it 10–20
      % or a fixed 10–20 gold?
    status: resolved
    applies_to:
      - EVT-06
    resolution: >-
      Decided 2026-11-19: the defeated player spills 10–20 % of the gold in the wallet on the floor, and the
      one who struck the player down gets a Player kill, shown in the player statistics.
  - topic: Monster levels
    question: Which Mark should the monsters match?
    status: resolved
    applies_to:
      - AGG-01
    resolution: >-
      Decided 2026-11-20: the Mark of the player who launched the Tithe; each monster's level varies around the area's level.
  - topic: Supplies
    question: How often should monsters, caches and sponsors give potions and rations?
    status: resolved
    applies_to:
      - EVT-05
    resolution: >-
      Decided 2026-11-20: a quarter as often as before, because there were far too many and the game became too
      easy: monsters 4 %, Veterans and rivals 15 %, caches 20 %; the Warden still always drops some.
  - topic: Loot and magic items
    question: How much loot and gold should fall, and how often should items be magic?
    status: resolved
    applies_to:
      - EVT-05
    resolution: >-
      Decided 2026-11-21: much less – gold from 20 % of the monsters at 1–3 × level, items from 5 %, magic 5 % and
      rare 1 % – so getting a magic weapon is a real event. Veterans, caches, the Warden, sponsor gifts, the Forge
      and the Noble Houses give magic items far more rarely too. Made rarer still the same day: magic 2 % and rare
      0.3 %, a Veteran's item magic one time in twelve, the Warden's item rare one in ten; the Forge, common items,
      gold and Renown stay as they are.

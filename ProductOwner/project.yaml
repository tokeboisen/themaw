dsl_version: '0.8'
project:
  name: The Maw
  description: >-
    Top-down dungeon crawler, a web app for now and an Android app later; the Maw Server runs the game. Players
    sign in with a user name, build several Branded characters and descend into the Maw in the deadly Tithe
    – Tithes that players open and join, up to 8 players with NPC rivals for the rest, alone or in parties
    formed in the first seconds – grow their skills by using them and return to the Rim between Tithes. The
    numbers in the rules are starting values that playtesting tunes (prototype/balance.js).
actors:
  - name: Player
domains:
  - The Tithe
  - Character Progression
  - The Rim
  - Online Play
bounded_contexts:
  - Tithe
  - Spectacle
  - Characters
  - Gear
  - Market
  - Patronage
  - Accounts
  - Parties
  - Lobby
